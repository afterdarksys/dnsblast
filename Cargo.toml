[package]
name = "dnsblast"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Concurrent comparative DNS and DNSSEC performance testing toolkit"
license = "MIT"
keywords = ["dns", "dnssec", "benchmark", "load-testing"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.4", features = ["derive"] }
hdrhistogram = "7.6.0"
hickory-proto = "0.26.1"
humantime = "2.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
